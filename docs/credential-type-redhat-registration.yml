---
# Minimal custom AAP credential type for the RHEL registration exercise.
#
# Create it once in AAP (Automation Execution > Infrastructure > Credential
# Types > Create), or POST this definition to
# /api/controller/v2/credential_types/. Then create a credential of this type
# with your real organization ID and activation key entered directly into the
# AAP form. The activation key field is secret: AAP masks it in the UI and in
# API responses.
#
# Both fields are injected as extra variables using the exact names that
# playbooks/rhel_register.yml already consumes, so no playbook change is
# required. The organization ID is not a secret; the activation key is.
name: Red Hat Registration (Activation Key)
kind: cloud
inputs:
  fields:
    - id: organization_id
      type: string
      label: Red Hat organization ID
      help_text: >-
        Numeric organization ID from console.redhat.com
        (Subscriptions > Activation Keys).
    - id: activation_key
      type: string
      label: Red Hat activation key
      secret: true
      help_text: >-
        Activation key from console.redhat.com
        (Subscriptions > Activation Keys). Treat it as a password.
injectors:
  env: {}
  extra_vars:
    organization_id: "{{ organization_id }}"
    activation_key: "{{ activation_key }}"
