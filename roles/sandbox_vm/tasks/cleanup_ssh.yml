---
- name: SSH cleanup | Remove the temporary identity and known-hosts file
  ansible.builtin.file:
    path: "{{ __sandbox_vm_ssh_workspace.path }}"
    state: absent
  delegate_to: localhost
  become: false
  when: __sandbox_vm_ssh_workspace.path is defined

- name: SSH cleanup | Discard connection state
  ansible.builtin.set_fact:
    __sandbox_vm_ssh_workspace: {}
    __sandbox_vm_connection_secret: {}
    ansible_ssh_private_key_file: "" # noqa var-naming[no-role-prefix]
    cacheable: false
