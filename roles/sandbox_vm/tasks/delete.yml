---
- name: Delete | Inspect the VM
  ansible.builtin.import_tasks: inspect_vm.yml

- name: Delete | Read the boot DataVolume
  kubernetes.core.k8s_info:
    api_version: cdi.kubevirt.io/v1beta1
    kind: DataVolume
    namespace: "{{ sandbox_vm_namespace }}"
    name: "{{ sandbox_vm_name }}"
  register: __sandbox_vm_datavolume

- name: Delete | Refuse to delete an unrelated DataVolume
  ansible.builtin.assert:
    that:
      - >-
        __sandbox_vm_datavolume.resources | length == 0 or
        (__sandbox_vm_datavolume.resources[0].metadata.labels | default({})).get(
          'app.kubernetes.io/part-of', '') == 'aap-sandbox-project'
    fail_msg: The DataVolume is not managed by this project; nothing has been deleted.

- name: Delete | Read the generated Secrets
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: "{{ sandbox_vm_namespace }}"
    name: "{{ item }}"
  loop:
    - "{{ sandbox_vm_ssh_secret_name }}"
    - "{{ sandbox_vm_cloudinit_secret_name }}"
  register: __sandbox_vm_secrets_to_delete
  no_log: true

- name: Delete | Refuse to delete unrelated Secrets
  ansible.builtin.assert:
    that:
      - >-
        item.resources | length == 0 or
        (item.resources[0].metadata.labels | default({})).get(
          'app.kubernetes.io/part-of', '') == 'aap-sandbox-project'
    fail_msg: A Secret is not managed by this project; nothing has been deleted.
  loop: "{{ __sandbox_vm_secrets_to_delete.results }}"
  no_log: true

- name: Delete | Remove the VM and wait for its dependents
  redhat.openshift_virtualization.kubevirt_vm:
    name: "{{ sandbox_vm_name }}"
    namespace: "{{ sandbox_vm_namespace }}"
    state: absent
    delete_options:
      propagationPolicy: Foreground
    wait: true
    wait_timeout: "{{ sandbox_vm_ready_timeout }}"

- name: Delete | Remove any remaining managed DataVolume
  redhat.openshift.k8s:
    api_version: cdi.kubevirt.io/v1beta1
    kind: DataVolume
    namespace: "{{ sandbox_vm_namespace }}"
    name: "{{ sandbox_vm_name }}"
    state: absent
    delete_options:
      propagationPolicy: Foreground
    wait: true
    wait_timeout: "{{ sandbox_vm_ready_timeout }}"

- name: Delete | Wait for CDI to remove the owned boot PVC
  kubernetes.core.k8s_info:
    api_version: v1
    kind: PersistentVolumeClaim
    namespace: "{{ sandbox_vm_namespace }}"
    name: "{{ sandbox_vm_name }}"
  register: __sandbox_vm_remaining_pvc
  until: __sandbox_vm_remaining_pvc.resources | length == 0
  retries: 60
  delay: 5

- name: Delete | Remove the generated Secrets
  redhat.openshift.k8s:
    api_version: v1
    kind: Secret
    namespace: "{{ sandbox_vm_namespace }}"
    name: "{{ item }}"
    state: absent
    wait: true
  loop:
    - "{{ sandbox_vm_ssh_secret_name }}"
    - "{{ sandbox_vm_cloudinit_secret_name }}"
  no_log: true
  diff: false
