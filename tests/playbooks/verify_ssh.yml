---
- name: Check that inventory contains the selected VM
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: sandbox_vm
      sandbox_vm_action: check_inventory

- name: Verify a fresh job can connect using the persisted SSH Secret
  hosts: all
  gather_facts: false
  tasks:
    - name: Verify guest connectivity without changing its configuration
      block:
        - name: Prepare SSH access using only the OpenShift credential
          ansible.builtin.include_role:
            name: sandbox_vm
          vars:
            sandbox_vm_action: prepare_ssh

        - name: Verify Ansible can execute in the guest
          ansible.builtin.ping:
      always:
        - name: Remove the temporary SSH identity
          ansible.builtin.include_role:
            name: sandbox_vm
          vars:
            sandbox_vm_action: cleanup_ssh
